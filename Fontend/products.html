<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products - ShopEase</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* ==========================================
           PRODUCTS PAGE
        ========================================== */

        .products-section {
            width: 92%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 0 70px;
        }


        .products-section h1 {
            text-align: center;
            font-size: 36px;
            margin: 0 0 8px;
        }


        .products-subtitle {
            text-align: center;
            color: #777;
            font-size: 16px;
            margin-bottom: 40px;
        }


        /* ==========================================
           PRODUCTS GRID
        ========================================== */

        .products-container {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 25px;
        }


        /* ==========================================
           PRODUCT CARD
        ========================================== */

        .product-card {
            background: #ffffff;

            border-radius: 14px;

            overflow: hidden;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            border: 1px solid #eeeeee;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            display: flex;

            flex-direction: column;

            min-width: 0;
        }


        .product-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.13);
        }


        /* ==========================================
           IMAGE AREA
        ========================================== */

        .product-image {

            width: 100%;

            height: 270px;

            background: #f8f9fb;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px;

            overflow: hidden;
        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            object-position: center;

            display: block;

            transition:
                transform 0.3s ease;
        }


        .product-card:hover
        .product-image img {

            transform:
                scale(1.05);
        }


        /* ==========================================
           PRODUCT INFO
        ========================================== */

        .product-info {

            padding: 20px;

            display: flex;

            flex-direction: column;

            flex: 1;
        }


        .product-category {

            display: inline-block;

            font-size: 12px;

            color: #2874f0;

            background: #eef5ff;

            padding: 5px 9px;

            border-radius: 5px;

            width: fit-content;

            margin-bottom: 10px;

            text-transform: capitalize;
        }


        .product-info h2 {

            font-size: 20px;

            line-height: 1.3;

            margin: 0 0 9px;

            color: #222;
        }


        /* ==========================================
           DESCRIPTION
        ========================================== */

        .product-description {

            color: #666;

            font-size: 14px;

            line-height: 1.5;

            margin: 0 0 12px;

            display: -webkit-box;

    

            -webkit-box-orient: vertical;

            overflow: hidden;

            min-height: 42px;
        }


        /* ==========================================
           RATING
        ========================================== */

        .rating {

            font-size: 14px;

            margin-bottom: 14px;

            color: #f39c12;
        }


        .rating span {

            color: #777;

            font-size: 13px;
        }


        /* ==========================================
           PRICE
        ========================================== */

        .price-box {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 18px;
        }


        .price {

            font-size: 21px;

            font-weight: bold;

            color: #111;
        }


        .old-price {

            font-size: 14px;

            color: #888;

            text-decoration: line-through;
        }


        .discount {

            font-size: 12px;

            font-weight: bold;

            color: #159447;

            background: #eaf8ef;

            padding: 4px 7px;

            border-radius: 4px;
        }


        /* ==========================================
           ACTION BUTTONS
        ========================================== */

        .product-actions {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: auto;
        }


        .product-actions button {

            border: none;

            padding: 12px 8px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;

            font-weight: 600;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .product-actions button:first-child {

            background: #2874f0;

            color: white;
        }


        .product-actions button:first-child:hover {

            background: #1558c0;
        }


        .product-actions button:last-child {

            background: #ff9f00;

            color: white;
        }


        .product-actions button:last-child:hover {

            background: #e58f00;
        }


        .product-actions button:disabled {

            background: #aaa !important;

            cursor: not-allowed;

            transform: none;
        }


        /* ==========================================
           LOADING
        ========================================== */

        #loading {

            text-align: center;

            padding: 50px;

            color: #666;

            font-size: 18px;
        }


        /* ==========================================
           ERROR
        ========================================== */

        #error-message {

            max-width: 700px;

            margin: 20px auto;

            padding: 15px;

            border-radius: 8px;

            background: #ffecec;

            color: #d32f2f;

            text-align: center;

            display: none;
        }


        /* ==========================================
           NO PRODUCTS
        ========================================== */

        .no-products {

            grid-column:
                1 / -1;

            text-align: center;

            padding: 60px 20px;
        }


        /* ==========================================
           RESPONSIVE - LAPTOP
        ========================================== */

        @media (max-width: 1200px) {

            .products-container {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }


            .product-image {

                height: 250px;
            }
        }


        /* ==========================================
           RESPONSIVE - TABLET
        ========================================== */

        @media (max-width: 850px) {

            .products-section {

                width: 94%;

                padding-top: 35px;
            }


            .products-container {

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 18px;
            }


            .product-image {

                height: 230px;
            }
        }


        /* ==========================================
           RESPONSIVE - MOBILE
        ========================================== */

        @media (max-width: 550px) {

            .products-section {

                width: 92%;

                padding:
                    30px 0 50px;
            }


            .products-section h1 {

                font-size: 28px;
            }


            .products-container {

                grid-template-columns: 1fr;

                gap: 20px;
            }


            .product-image {

                height: 280px;
            }


            .product-info {

                padding: 18px;
            }
        }

    </style>

</head>


<body>


<!-- ==========================================
     NAVBAR
========================================== -->

<header class="main-header">
     <!-- LOGO -->
       <div class="logo"> 
        <a href="index.html">ShopEase</a> 
    </div>
     <!-- NAVIGATION --> 
      <nav class="main-nav">
         <ul> <li> <a href="index.html"> Home </a>
         </li> <li> <a href="products.html" class="active"> Products </a> 
        </li> <li> <a href="categories.html"> Categories </a> </li>
         <li> <a href="about.html"> About </a> </li>
          <li> <a href="contact.html"> Contact </a> </li>
         </ul>
         </nav>
          <!-- HEADER ACTIONS -->
            <div class="header-actions"> 
                <a href="search.html" title="Search"> 🔍 Search </a>
                 <a href="login.html"> Login </a> 
                 <a href="signup.html"> Sign Up </a>
                  <a href="wishlist.html"> ❤️ Wishlist </a>
                   <a href="cart.html"> 🛒 Cart </a>
                 </div>
                 </header>



<!-- ==========================================
     PRODUCTS
========================================== -->

<main>

    <section class="products-section">

        <h1>
            All Products
        </h1>


        <p class="products-subtitle">
            Explore our latest products
        </p>


        <!-- Loading -->

        <div id="loading">
            Loading products...
        </div>


        <!-- Error -->

        <div id="error-message"></div>


        <!-- Products -->

        <div
            id="products-container"
            class="products-container"
        >
        </div>

    </section>

</main>



<!-- ==========================================
     JAVASCRIPT
========================================== -->

<script>

const API_URL =
    "http://localhost:5000/api/products";

const CART_API_URL =
    "http://localhost:5000/api/cart";


const productsContainer =
    document.getElementById(
        "products-container"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "error-message"
    );


// ==========================================
// LOAD PRODUCTS
// ==========================================

async function loadProducts() {

    try {

        loading.style.display =
            "block";

        errorMessage.style.display =
            "none";

        errorMessage.innerText = "";


        const response =
            await fetch(API_URL);


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Failed to load products"
            );

        }


        loading.style.display =
            "none";


        displayProducts(
            data.products
        );


    } catch (error) {

        console.error(
            "Products Error:",
            error
        );


        loading.style.display =
            "none";


        errorMessage.innerText =
            error.message ||
            "Unable to load products. Please make sure backend server is running.";


        errorMessage.style.display =
            "block";

    }

}


// ==========================================
// DISPLAY PRODUCTS
// ==========================================

function displayProducts(products) {

    productsContainer.innerHTML = "";


    if (
        !products ||
        products.length === 0
    ) {

        productsContainer.innerHTML = `

            <div class="no-products">

                <h2>
                    No Products Found
                </h2>

                <p>
                    There are no products available.
                </p>

            </div>

        `;

        return;

    }


    products.forEach(product => {

        const productCard =
            document.createElement("div");


        productCard.className =
            "product-card";


        const stock =
            Number(product.stock || 0);


        const outOfStock =
            stock <= 0;


        productCard.innerHTML = `

            <!-- IMAGE -->

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                    loading="lazy"
                    onerror="this.onerror=null; this.src='image/placeholder.jpg';"
                >

            </div>


            <!-- INFO -->

            <div class="product-info">

                <span class="product-category">

                    ${product.category || "Product"}

                </span>


                <h2>

                    ${product.name}

                </h2>


                <p class="product-description">

                    ${product.shortDescription || ""}

                </p>


                <div class="rating">

                    ⭐ ${Number(product.rating || 0).toFixed(1)}

                    <span>

                        (${product.reviews || 0} Reviews)

                    </span>

                </div>


                <div class="price-box">

                    <span class="price">

                        ₹${Number(product.price).toLocaleString("en-IN")}

                    </span>


                    ${
                        product.oldPrice
                        ?
                        `
                        <span class="old-price">

                            ₹${Number(product.oldPrice)
                                .toLocaleString("en-IN")}

                        </span>
                        `
                        :
                        ""
                    }


                    ${
                        product.discount
                        ?
                        `
                        <span class="discount">

                            ${product.discount}% OFF

                        </span>
                        `
                        :
                        ""
                    }

                </div>


                <div class="product-actions">

                    <button
                        onclick="viewProduct('${product._id}')"
                    >
                        View Details
                    </button>


                    <button
                        onclick="addToCart('${product._id}')"
                        ${outOfStock ? "disabled" : ""}
                    >

                        ${
                            outOfStock
                            ? "Out of Stock"
                            : "Add to Cart"
                        }

                    </button>

                </div>

            </div>

        `;


        productsContainer.appendChild(
            productCard
        );

    });

}


// ==========================================
// VIEW PRODUCT
// ==========================================

function viewProduct(productId) {

    window.location.href =
        `product-details.html?id=${productId}`;

}


// ==========================================
// ADD TO CART
// ==========================================

async function addToCart(productId) {

    const token =
        localStorage.getItem("token");


    // ==================================
    // LOGIN CHECK
    // ==================================

    if (!token) {

        alert(
            "Please login first to add products to cart."
        );

        window.location.href =
            "login.html";

        return;

    }


    try {

        const response =
            await fetch(
                CART_API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${token}`

                    },

                    body: JSON.stringify({

                        productId:
                            productId,

                        quantity: 1

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to add product to cart"
            );

        }


        alert(
            "✅ Product added to cart successfully!"
        );


    } catch (error) {

        console.error(
            "Add To Cart Error:",
            error
        );


        alert(
            error.message
        );

    }

}


// ==========================================
// LOAD
// ==========================================

loadProducts();

</script>


</body>

</html>
