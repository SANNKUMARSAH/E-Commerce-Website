<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ShopEase</title>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    header { background: #111827; color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #93c5fd; text-decoration: none; margin-left: 16px; font-size: 14px; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; display: grid; gap: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { margin-bottom: 14px; font-size: 18px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    label { font-size: 13px; color: #374151; display: grid; gap: 4px; }
    input, textarea { padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    textarea { min-height: 70px; resize: vertical; }
    .full { grid-column: 1 / -1; }
    button { padding: 9px 16px; border: 0; border-radius: 8px; cursor: pointer; font-weight: bold; background: #2563eb; color: #fff; }
    button.danger { background: #dc2626; }
    button.light { background: #e5e7eb; color: #111827; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #e5e7eb; text-align: left; vertical-align: middle; }
    td img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
    td input { width: 90px; padding: 6px; }
    .table-wrap { overflow-x: auto; }
    #msg { display: none; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    #msg.ok { display: block; background: #d4edda; color: #155724; }
    #msg.err { display: block; background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <header>
    <strong>ShopEase Admin</strong>
    <nav>
      <a href="index.html">Store</a>
      <a href="login.html" id="logoutLink">Switch account</a>
    </nav>
  </header>

  <main id="app" style="display:none">
    <div id="msg"></div>

    <section class="card">
      <h2>Add product</h2>
      <form id="addForm">
        <label>Name <input name="name" required></label>
        <label>Category <input name="category" required placeholder="Electronics"></label>
        <label>Price (₹) <input name="price" type="number" min="0" required></label>
        <label>Old price (₹) <input name="oldPrice" type="number" min="0"></label>
        <label>Stock <input name="stock" type="number" min="0" required value="10"></label>
        <label>Brand <input name="brand"></label>
        <label class="full">Image (path like image/laptop.jpg, or a full https URL)
          <input name="image" required placeholder="image/laptop.jpg">
        </label>
        <label class="full">Short description <input name="shortDescription" required></label>
        <label class="full">Description <textarea name="description" required></textarea></label>
        <div class="full"><button type="submit" id="addBtn">Add product</button></div>
      </form>
    </section>

    <section class="card">
      <h2>Products</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th></th><th>Name</th><th>Category</th><th>Price (₹)</th><th>Stock</th><th></th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

<script>
  const API = window.API_BASE;
  const token = localStorage.getItem("token");
  let user = null;

  try { user = JSON.parse(localStorage.getItem("user") || "null"); } catch (e) {}

  // Only the UI is hidden here. The real protection is on the server.
  if (!token || !user || user.role !== "admin") {
    alert("Admin login required.");
    window.location.href = "login.html";
  } else {
    document.getElementById("app").style.display = "grid";
    loadProducts();
  }

  const msg = document.getElementById("msg");

  function show(text, ok) {
    msg.className = ok ? "ok" : "err";
    msg.textContent = text;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function esc(v) {
    const d = document.createElement("div");
    d.textContent = v == null ? "" : String(v);
    return d.innerHTML;
  }

  async function api(path, options) {
    const res = await fetch(API + path, {
      ...options,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Request failed");
    return data;
  }

  async function loadProducts() {
    const rows = document.getElementById("rows");
    try {
      const data = await api("/api/products");
      if (!data.products.length) {
        rows.innerHTML = '<tr><td colspan="6">No products yet.</td></tr>';
        return;
      }
      rows.innerHTML = data.products.map(p => `
        <tr>
          <td><img src="${esc(p.image)}" alt=""></td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.category)}</td>
          <td><input type="number" min="0" id="price-${p._id}" value="${esc(p.price)}"></td>
          <td><input type="number" min="0" id="stock-${p._id}" value="${esc(p.stock)}"></td>
          <td>
            <button class="light" onclick="saveProduct('${p._id}')">Save</button>
            <button class="danger" onclick="removeProduct('${p._id}')">Delete</button>
          </td>
        </tr>`).join("");
    } catch (err) {
      rows.innerHTML = '<tr><td colspan="6">' + esc(err.message) + "</td></tr>";
    }
  }

  async function saveProduct(id) {
    try {
      await api("/api/products/" + id, {
        method: "PUT",
        body: JSON.stringify({
          price: Number(document.getElementById("price-" + id).value),
          stock: Number(document.getElementById("stock-" + id).value)
        })
      });
      show("Product updated.", true);
    } catch (err) { show(err.message, false); }
  }

  async function removeProduct(id) {
    if (!confirm("Delete this product?")) return;
    try {
      await api("/api/products/" + id, { method: "DELETE" });
      show("Product deleted.", true);
      loadProducts();
    } catch (err) { show(err.message, false); }
  }

  document.getElementById("addForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const btn = document.getElementById("addBtn");
    const f = new FormData(this);
    const body = {
      name: f.get("name").trim(),
      category: f.get("category").trim(),
      price: Number(f.get("price")),
      stock: Number(f.get("stock")),
      brand: f.get("brand").trim(),
      image: f.get("image").trim(),
      shortDescription: f.get("shortDescription").trim(),
      description: f.get("description").trim()
    };
    if (f.get("oldPrice")) body.oldPrice = Number(f.get("oldPrice"));
    if (body.oldPrice && body.oldPrice > body.price) {
      body.discount = Math.round(((body.oldPrice - body.price) / body.oldPrice) * 100);
    }

    btn.disabled = true;
    try {
      await api("/api/products", { method: "POST", body: JSON.stringify(body) });
      show("Product added.", true);
      this.reset();
      loadProducts();
    } catch (err) { show(err.message, false); }
    btn.disabled = false;
  });

  document.getElementById("logoutLink").addEventListener("click", function () {
    localStorage.removeItem("token");
    localStorage.removeItem("user");
  });
</script>
</body>
</html>
